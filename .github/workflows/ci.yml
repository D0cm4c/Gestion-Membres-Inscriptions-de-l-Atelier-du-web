name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntaxe JavaScript (node --check)
        run: |
          status=0
          for f in *.js tests/*.js; do
            [ -f "$f" ] || continue
            if ! node --check "$f"; then
              echo "::error file=$f::Erreur de syntaxe dans $f"
              status=1
            fi
          done
          exit $status

      - name: Smoke test des pages (structure, layout, versions ?v=)
        run: node tests/smoke-pages.js
